<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container px-4">
    <a class="navbar-brand fw-bold fs-4" href="../index.html">Webshop</a>

    <button class="navbar-toggler" type="button"
      data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav gap-lg-3 text-center">

        <li class="nav-item">
          <a class="nav-link" href="../index.html">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="aboutUs.html">About</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="contactUs.html">Contact</a>
        </li>

      </ul>
    </div>
  </div>
</nav>

<main class="flex-grow-1">
  <section class="py-5">
    <div class="container px-4">
      <div class="row justify-content-center">
        <div class="col-lg-6">

          <h2 class="text-center mb-4">Order</h2>

          <div class="card p-4 shadow">
            <form id="order-form">

              <input class="form-control mb-3" id="name" placeholder="Name">
              <small id="name-error" class="text-danger"></small>

              <input class="form-control mb-3" id="email" placeholder="Email">
              <small id="email-error" class="text-danger"></small>

              <input class="form-control mb-3" id="phone" placeholder="Phone">
              <small id="phone-error" class="text-danger"></small>

              <input class="form-control mb-3" id="street" placeholder="Street">
              <small id="street-error" class="text-danger"></small>

              <input class="form-control mb-3" id="city" placeholder="City">
              <small id="city-error" class="text-danger"></small>

              <input class="form-control mb-3" id="zipcode" placeholder="Zip Code">
              <small id="zipcode-error" class="text-danger"></small>

              <button class="btn btn-dark w-100 mt-3">Submit Order</button>

            </form>
          </div>

        </div>
      </div>
    </div>
  </section>
</main>

<footer class="text-center text-white py-4 mt-auto">
  <p>© 2026 Webshop</p>
</footer>

<script src="../js/webshop.js"></script>

</body>
</html>
