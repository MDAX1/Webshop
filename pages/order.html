<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webshop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <section class="order-section container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="card shadow-sm border-1 rounded-4">
            <div class="card-body p-4 p-md-5">
              <h2 class="mb-4 text-center">Orders</h2>
              <form id="order-form" novalidate>
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label for="name" class="form-label">Name</label>
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="name"
                      name="name"
                      placeholder="Name"
                    />
                    <small id="name-error" class="text-danger"></small>
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="lastname" class="form-label">Efternamn</label>
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="lastname"
                      name="lastname"
                      placeholder="Last name"
                    />
                    <small id="lastname-error" class="text-danger"></small>
                  </div>
                  <div class="col-6 col-md-6">
                    <label for="email" class="form-label">E-mail</label>
                    <input
                      type="email"
                      class="form-control form-control-lg"
                      id="email"
                      name="email"
                      placeholder="name@email.com"
                    />
                    <small id="email-error" class="text-danger"></small>
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="phone" class="form-label">Phone</label>
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="phone"
                      name="phone"
                      placeholder="070-123 45 67"
                    />
                    <small id="phone-error" class="text-danger"></small>
                  </div>
                  <div class="col-12">
                    <label for="street" class="form-label"
                      >Street Address</label
                    >
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="street"
                      name="street"
                      placeholder="Example Street 1"
                    />
                    <small id="street-error" class="text-danger"></small>
                  </div>
                  <div class="col-6 col-md-4">
                    <label for="country" class="form-label">Country</label>
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="country"
                      name="country"
                      placeholder="Sweden"
                    />
                    <small id="country-error" class="text-danger"></small>
                  </div>
                  <div class="col-6 col-md-4">
                    <label for="city" class="form-label">City</label>
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="city"
                      name="city"
                      placeholder="Stockholm"
                    />
                    <small id="city-error" class="text-danger"></small>
                  </div>
                  <div class="col-12 col-md-4">
                    <label for="zipcode" class="form-label">Zip code</label>
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="zipcode"
                      name="zipcode"
                      placeholder="12345"
                    />
                    <small id="zipcode-error" class="text-danger"></small>
                  </div>
                  <div class="col-12">
                    <small
                      id="product-error"
                      class="text-danger d-block mb-2"
                    ></small>
                  </div>
                  <div class="col-12 d-grid">
                    <button
                      type="submit"
                      class="btn btn-primary btn-lg rounded-3"
                    >
                      Submit Order
                    </button>
                  </div>
                </div>
              </form>
              <div
                id="success-message"
                class="mt-4 fw-semibold text-success text-center"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
