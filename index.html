<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webshop</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Your stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container px-4">
      <a class="navbar-brand fw-bold fs-4" href="index.html">Webshop</a>
      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-lg-3 text-center">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="pages/aboutUs.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="pages/contactUs.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header>
    <div class="container px-4 px-lg-5 text-center">
      <div class="hero-label">New Collection 2025</div>
      <h1>Shop in<br/>style.</h1>
      <p>Curated goods for the discerning eye — discover pieces worth keeping.</p>
    </div>
  </header>

  <!-- Products -->
  <main class="flex-grow-1 bg-light">
    <section class="py-5">
      <div class="container px-4 px-lg-5">
        <div class="text-center mb-4">
          <p class="section-label">Our offerings</p>
          <h2 class="section-title">Featured Products <span class="section-rule"></span></h2>
        </div>
        <div id="products" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4"></div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-primary text-center text-white py-4 mt-auto">
    <div class="container">
      <ul class="nav justify-content-center mb-3">
        <li class="nav-item"><a href="index.html" class="nav-link text-white px-3">Home</a></li>
        <li class="nav-item"><a href="pages/aboutUs.html" class="nav-link text-white px-3">About</a></li>
        <li class="nav-item"><a href="pages/contactUs.html" class="nav-link text-white px-3">Contact</a></li>
      </ul>
      <hr class="opacity-25" />
      <p class="mb-0 opacity-75 small">&copy; 2026 Webshop, Inc</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App JS -->
  <script src="js/webshop.js" defer></script>

</html>
