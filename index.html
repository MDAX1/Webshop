<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webshop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <section class="order-section">
      
      <h2>Beställningsformulär</h2>

      <form id="order-form" novalidate>
        <div class="form-group">
          <label for="name">Namn</label>
          <input type="text" id="name" name="name" />
          <small class="error" id="name-error"></small>
        </div>

        <div class="form-group">
          <label for="email">E-post</label>
          <input type="text" id="email" name="email" />
          <small class="error" id="email-error"></small>
        </div>

        <div class="form-group">
          <label for="phone">Telefon</label>
          <input type="text" id="phone" name="phone" />
          <small class="error" id="phone-error"></small>
        </div>

        <div class="form-group">
          <label for="street">Gatuadress</label>
          <input type="text" id="street" name="street" />
          <small class="error" id="street-error"></small>
        </div>

        <div class="form-group">
          <label for="zipcode">Postnummer</label>
          <input type="text" id="zipcode" name="zipcode" />
          <small class="error" id="zipcode-error"></small>
        </div>

        <div class="form-group">
          <label for="city">Ort</label>
          <input type="text" id="city" name="city" />
          <small class="error" id="city-error"></small>
        </div>

        <small class="error" id="product-error"></small>
        <button type="submit">Beställ produkt</button>
      </form>

      <div id="success-message" class="success-message"></div>
    </section>

  </body>
</html>
